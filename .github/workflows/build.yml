name: Build BlockStrike

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;33.0.2" "build-tools;35.0.0"

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          adb version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;33.0.2|build-tools;35.0.0' || true

      - name: Install Godot Android Gradle build template
        run: |
          godot --headless --path . --install-android-build-template
          test -f android/build.gradle || test -d android/build
          echo "Android Gradle template installed."

      - name: Prepare build directory
        run: mkdir -p build/windows build/android

      - name: Validate project
        run: godot --headless --path . --editor --quit --verbose

      - name: Build Windows
        shell: bash
        run: |
          set +e
          godot --headless --path . --verbose --export-release "Windows Desktop" build/windows/BlockStrike.exe
          code=$?
          if [ -s build/windows/BlockStrike.exe ]; then
            echo "Windows executable was produced (Godot exit code: $code)."
            exit 0
          fi
          exit "$code"

      - name: Build Android
        shell: bash
        run: |
          set +e
          godot --headless --path . --verbose --export-release "Android" build/android/BlockStrike.apk
          code=$?
          if [ -s build/android/BlockStrike.apk ]; then
            echo "Android APK was produced (Godot exit code: $code)."
            exit 0
          fi
          exit "$code"

      - name: Show build outputs
        run: |
          find build -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-Windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-Android
          path: build/android/
          if-no-files-found: error
          retention-days: 14
