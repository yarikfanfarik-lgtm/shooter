name: Build BlockStrike

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          adb version

      - name: Prepare build directory
        run: mkdir -p build/windows build/android

      - name: Validate project
        run: godot --headless --path . --editor --quit --verbose

      - name: Build Windows
        run: godot --headless --path . --verbose --export-release "Windows Desktop" build/windows/BlockStrike.exe

      - name: Build Android
        run: godot --headless --path . --verbose --export-release "Android" build/android/BlockStrike.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-Windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-Android
          path: build/android/
          if-no-files-found: error
          retention-days: 14
