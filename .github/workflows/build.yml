name: Build BlockStrike

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/godot"
          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.1-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          "$HOME/godot/godot" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz \
            -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          if [ -d /tmp/godot_templates/templates ]; then
            cp -r /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          else
            echo "Export templates archive has an unexpected layout"
            find /tmp/godot_templates -maxdepth 3 -type f | head -50
            exit 1
          fi

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Validate project
        shell: bash
        run: |
          "$HOME/godot/godot" --headless --path . --editor --quit

      - name: Build Windows
        shell: bash
        run: |
          mkdir -p build/windows
          "$HOME/godot/godot" --headless --path . --export-release "Windows Desktop" build/windows/BlockStrike.exe

      - name: Build Android
        shell: bash
        run: |
          mkdir -p build/android
          "$HOME/godot/godot" --headless --path . --export-release "Android" build/android/BlockStrike.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-Windows
          path: build/windows/BlockStrike.exe
          if-no-files-found: error

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-Android
          path: build/android/BlockStrike.apk
          if-no-files-found: error
