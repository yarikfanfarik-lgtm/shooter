name: Build BlockStrike

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot configuration and export templates
        shell: bash
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi

          SRC=""
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          elif [ -d "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" ]; then
            SRC="/root/.local/share/godot/templates/${GODOT_VERSION}.stable"
          fi

          if [ -z "$SRC" ]; then
            echo "Godot export templates not found in the CI image"
            echo "Searching common locations..."
            find /root/.local/share/godot -maxdepth 4 -type f -name 'windows_*x86_64*.exe' -print || true
            find /root/.local/share/godot -maxdepth 3 -type d -print || true
            exit 1
          fi

          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$SRC" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/windows_release_x86_64.exe"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/windows_debug_x86_64.exe"

      - name: Prepare build directory
        run: mkdir -p build

      - name: Validate project
        run: godot --headless --path . --editor --quit --verbose

      - name: Build Windows
        run: godot --headless --path . --verbose --export-release "Windows Desktop" build/BlockStrike.exe

      - name: Build Android
        run: godot --headless --path . --verbose --export-release "Android" build/BlockStrike.apk

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: BlockStrike-builds
          path: build/
